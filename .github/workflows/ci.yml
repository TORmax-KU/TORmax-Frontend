name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # allows a manual run from the Actions tab

# Cancel an in-progress run when a newer commit is pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22 # matches the Dockerfile; tests rely on Node's built-in TypeScript stripping (22.18+)
          cache: npm

      - run: npm ci

      # Reported but not blocking yet: the codebase has existing lint errors.
      # Remove `continue-on-error` once `npm run lint` passes locally.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # Next.js generates global route types (LayoutProps, PageProps) into .next/,
      # which a fresh checkout doesn't have. Generate them before type checking.
      - name: Type check
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5001
          NEXT_TELEMETRY_DISABLED: 1
